# DNS only. DHCP for the AP is served by systemd-networkd (see 60-br0.network);
# running both put two servers on br0's port 67 and one of them lost the race.
no-dhcp-interface=br0

# bind-dynamic rather than bind-interfaces: br0 is created by networkd, so it
# may not exist when dnsmasq starts. bind-interfaces fails outright in that
# case and the service stays dead for the session; bind-dynamic picks the
# interface up when it appears.
interface=br0
bind-dynamic
