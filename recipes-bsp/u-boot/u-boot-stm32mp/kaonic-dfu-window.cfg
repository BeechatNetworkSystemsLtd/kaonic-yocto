# On a boot from SD card or eMMC, offer USB programming for 5 seconds. The wait
# only becomes a programming session when a DFU request arrives, so a host that
# merely enumerates the board does not stop it booting. A boot from the ROM's
# USB route skips this: its bootcmd enters stm32prog anyway.
CONFIG_USE_PREBOOT=y
CONFIG_PREBOOT="if test ${boot_device} = mmc; then env set stm32prog_wait 5; stm32prog usb 0; fi"
